<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="conn">API Connection placeholder</div>
    <button id="startFlight">Start New Flight Simulation</button>
    <div id="output">API Status placeholder</div>
    <p class="flight-hint">
      Click on a flight to see metrics if active, or history if completed
    </p>
    <div id="details"></div>
    <script>
      const url = "http://localhost:13000/flights";
      const es = new EventSource(url);

      // Handle start flight button
      document
        .getElementById("startFlight")
        .addEventListener("click", async () => {
          try {
            const response = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
            });
            const flight = await response.json();
            if (!response.ok) {
              alert("Failed to create flight");
            }
          } catch (err) {
            console.error("Error creating flight:", err);
            alert("Error creating flight");
          }
        });

      es.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);

          if (data.length === 0) {
            document.getElementById("output").innerHTML =
              "<p>No data available</p>";
          } else {
            const columns = Object.keys(data[0]);

            let tableHTML = "<table><thead><tr>";
            columns.forEach((col) => {
              tableHTML += `<th>${col.toUpperCase()}</th>`;
            });
            tableHTML += "</tr></thead><tbody>";

            data.forEach((row) => {
              tableHTML += `<tr class="clickable-row" data-id="${row.id}" data-status="${row.status}">`;
              columns.forEach((col) => {
                tableHTML += `<td>${row[col]}</td>`;
              });
              tableHTML += "</tr>";
            });

            tableHTML += "</tbody></table>";
            document.getElementById("output").innerHTML = tableHTML;

            // Add click handlers to rows
            document.querySelectorAll(".clickable-row").forEach((row) => {
              row.addEventListener("click", handleFlightClick);
            });
          }
        } catch (err) {
          console.error("Error parsing data:", err);
          document.getElementById("output").innerHTML =
            `<p style="color:red;">Error parsing data</p>`;
        }
      };

      es.onerror = (err) => {
        document.getElementById("conn").innerHTML =
          `<p style="color:red;">Error: Endpoint not responding or connection lost</p>`;
        console.error("SSE Error:", err);
      };

      es.onopen = () => {
        document.getElementById("conn").innerHTML =
          `<p style="color:green;">SSE Connected: ${url}</p>`;
      };

      // Handle flight row click
      let activeMetricsEventSource = null;

      async function handleFlightClick(event) {
        const flightId = event.currentTarget.dataset.id;
        const status = event.currentTarget.dataset.status;

        const detailsDiv = document.getElementById("details");

        // Close any existing SSE connection for metrics
        if (activeMetricsEventSource) {
          activeMetricsEventSource.close();
          activeMetricsEventSource = null;
        }

        try {
          let endpoint;
          let title;

          if (status === "Active") {
            endpoint = `http://localhost:13000/flights/${flightId}`;
            title = `Current Metrics for Flight ${flightId}`;

            // Use SSE for active flights
            detailsDiv.innerHTML = `<h3>${title}</h3><p>Loading metrics...</p>`;
            
            activeMetricsEventSource = new EventSource(endpoint);

            activeMetricsEventSource.onmessage = (e) => {
              try {
                const data = JSON.parse(e.data);

                if (data.error) {
                  detailsDiv.innerHTML = `<h3>${title}</h3><p style="color:red;">${data.error}</p>`;
                  return;
                }

                // Build table HTML
                let html = `<h3>${title}</h3>`;
                const columns = Object.keys(data);
                html += "<table><thead><tr>";
                columns.forEach((col) => {
                  html += `<th>${col.toUpperCase()}</th>`;
                });
                html += "</tr></thead><tbody><tr>";
                columns.forEach((col) => {
                  html += `<td>${data[col] !== null ? data[col] : "N/A"}</td>`;
                });
                html += "</tr></tbody></table>";

                detailsDiv.innerHTML = html;
              } catch (err) {
                console.error("Error parsing metrics data:", err);
              }
            };

            activeMetricsEventSource.onerror = (err) => {
              console.error("Metrics SSE Error:", err);
              detailsDiv.innerHTML = `<h3>${title}</h3><p style="color:red;">Error loading metrics</p>`;
            };

          } else {
            // For completed flights, fetch history once (no SSE needed)
            endpoint = `http://localhost:13000/flights/${flightId}/history`;
            title = `Full History for Flight ${flightId}`;

            const response = await fetch(endpoint);
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();

            // Build table HTML
            let html = `<h3>${title}</h3>`;

            if (Array.isArray(data)) {
              if (data.length === 0) {
                html += "<p>No data available</p>";
              } else {
                const columns = Object.keys(data[0]);
                html += "<table><thead><tr>";
                columns.forEach((col) => {
                  html += `<th>${col.toUpperCase()}</th>`;
                });
                html += "</tr></thead><tbody>";

                data.forEach((row) => {
                  html += "<tr>";
                  columns.forEach((col) => {
                    html += `<td>${row[col] !== null ? row[col] : "N/A"}</td>`;
                  });
                  html += "</tr>";
                });

                html += "</tbody></table>";
              }
            }

            detailsDiv.innerHTML = html;
          }
        } catch (err) {
          console.error("Error fetching flight details:", err);
          detailsDiv.innerHTML = `<p style="color:red;">Error loading details: ${err.message}</p>`;
        }
      }
    </script>
  </body>
</html>
